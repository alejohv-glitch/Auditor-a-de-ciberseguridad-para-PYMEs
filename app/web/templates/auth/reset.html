{% extends "base.html" %}{% block title %}Nueva contraseña · {{ app_name }}{% endblock %}
{% block content %}
<div class="card"><h1>Nueva contraseña</h1>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/reset/{{ token }}"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="password">Contraseña (mín. 10 caracteres)</label><input id="password" type="password" name="password" required minlength="10" autocomplete="new-password">
<p></p><button class="btn">Guardar</button></form></div>
{% endblock %}
