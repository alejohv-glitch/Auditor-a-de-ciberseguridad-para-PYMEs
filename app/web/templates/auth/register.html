{% extends "base.html" %}{% block title %}Crear cuenta · {{ app_name }}{% endblock %}
{% block content %}
<div class="card"><h1>Crear cuenta gratuita</h1>
<p class="muted">1 dominio, informe completo, sin tarjeta.</p>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/register">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="company">Empresa (opcional)</label><input id="company" type="text" name="company" value="{{ company or '' }}" maxlength="120">
  <label for="email">Email</label><input id="email" type="email" name="email" value="{{ email or '' }}" required autocomplete="email">
  <label for="password">Contraseña (mín. 10 caracteres)</label><input id="password" type="password" name="password" required minlength="10" autocomplete="new-password">
  <label class="check"><input type="checkbox" name="accept_terms" value="yes" required> <span>Acepto las <a href="/terms">condiciones</a> y la <a href="/privacy">política de privacidad</a>.</span></label>
  <p></p><button class="btn">Crear cuenta</button>
</form></div>
{% endblock %}
