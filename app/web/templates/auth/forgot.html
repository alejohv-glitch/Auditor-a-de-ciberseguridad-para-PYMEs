{% extends "base.html" %}{% block title %}Recuperar contraseña · {{ app_name }}{% endblock %}
{% block content %}
<div class="card"><h1>Recuperar contraseña</h1>
{% if sent %}<div class="alert ok">Si existe una cuenta con ese email, le hemos enviado un enlace (válido 1 hora).</div>{% endif %}
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/forgot"><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="email">Email</label><input id="email" type="email" name="email" required>
<p></p><button class="btn">Enviar enlace</button></form></div>
{% endblock %}
